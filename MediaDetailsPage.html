<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Movie Details</title>
  <link rel="stylesheet" href="MediaDetailsPage.css">
</head>
<body>

  <!-- HEADER -->
  <header class="top-bar">
    <div class="left">
      <img src="" alt="Logo" class="logo">
    </div>

    <div class="right">
      <input type="text" placeholder="Search..." class="search-box">
      <button class="icon-btn">☰</button>
      <button class="icon-btn">⚙</button>
    </div>
  </header>

  <!-- MAIN CONTENT --> 
  <main class="movie-container">

    <!-- POSTER -->
    <section class="poster-section">
      <img src="" alt="Movie Poster">
    </section>

    <!-- DETAILS -->
    <section class="details-section">
      <h1 class="movie-title">MOVIE NAME</h1>

      <div class="meta">
        <span>Genre</span>
        <span>Rating</span>
        <span>Duration</span>
      </div>

      <p class="description">
        Movie description goes here. This is just placeholder text.
      </p>

      <button class="trailer-btn">Watch Trailer</button>
    </section>

  </main>

  <!-- BOOK TICKET BUTTON -->
  <button class="book-ticket">Book Ticket</button>

  <script src="MediaDetailsPage.js"></script>
</body>
</html>
